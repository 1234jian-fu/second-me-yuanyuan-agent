<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Text Record - Second Me</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "surface-tint": "#566342",
                      "outline": "#76786e",
                      "on-tertiary-fixed-variant": "#4c463e",
                      "surface-container": "#efeeea",
                      "surface-variant": "#e4e2de",
                      "tertiary-fixed": "#ebe1d6",
                      "secondary-fixed": "#d8e4eb",
                      "on-primary-container": "#384425",
                      "on-secondary-fixed-variant": "#3d484e",
                      "surface-container-low": "#f5f3ef",
                      "background": "#fbf9f5",
                      "on-primary": "#ffffff",
                      "secondary": "#556066",
                      "surface": "#fbf9f5",
                      "tertiary": "#645d55",
                      "on-secondary-fixed": "#121d22",
                      "on-primary-fixed": "#141f05",
                      "on-error": "#ffffff",
                      "primary-fixed-dim": "#becca3",
                      "on-tertiary-fixed": "#1f1b14",
                      "on-background": "#1b1c1a",
                      "surface-bright": "#fbf9f5",
                      "surface-container-highest": "#e4e2de",
                      "inverse-primary": "#becca3",
                      "tertiary-fixed-dim": "#cec5bb",
                      "secondary-fixed-dim": "#bcc8cf",
                      "outline-variant": "#c6c8bb",
                      "error-container": "#ffdad6",
                      "on-secondary-container": "#59646a",
                      "error": "#ba1a1a",
                      "inverse-surface": "#30312e",
                      "primary-fixed": "#dae8be",
                      "primary": "#566342",
                      "primary-container": "#a3b18a",
                      "on-error-container": "#93000a",
                      "surface-container-high": "#eae8e4"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",

                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-margin": "32px",
                      "card-padding": "24px",
                      "unit": "8px",
                      "section-gap": "64px",
                      "gutter": "24px"

              "fontFamily": {
                      "label-sm": [
                              "Manrope"

                      "body-lg": [
                              "Manrope"

                      "headline-lg": [

                      ],
                      "body-md": [

                      "headline-md": [

                      "body-lg": [

                      "headline-lg": [

                      "body-md": [
                              "16px",

                      ],
                      "headline-md": [

                                      "lineHeight": "1.3",

                      "headline-display": [
                              "48px",

              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: #FDFBF7;
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-watermark {
            background-image: url('data:image/svg+xml;utf8,<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg"><path d="M100 20C40 20 20 80 20 100c0 20 20 80 80 80s80-60 80-80c0-20-20-80-80-80zM60 100c0-30 20-50 40-50s40 20 40 50-20 50-40 50-40-20-40-50z" fill="%23A3B18A" opacity="0.05"/></svg>');
            background-repeat: no-repeat;
            background-position: top -50px right -50px;
            background-size: cover;
        }

        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(163, 177, 138, 0.05), 0 4px 12px -4px rgba(163, 177, 138, 0.03);
        }

        .ambient-shadow-light {
            box-shadow: 0 8px 30px -8px rgba(0, 0, 0, 0.03);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="font-body-md text-on-surface antialiased bg-watermark min-h-screen relative flex flex-col pb-safe">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#FDFBF7]/80 dark:bg-stone-950/80 backdrop-blur-md border-none shadow-sm shadow-[#A3B18A]/5 font-['Manrope'] font-light tracking-tight flex justify-between items-center px-8 h-16 w-full">
<button class="hover:opacity-70 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-stone-800 dark:text-stone-100" style="font-variation-settings: 'wght' 300;">arrow_back</span>
</button>
<h1 class="text-lg font-semibold text-stone-800 dark:text-stone-100">文字记录</h1>
<button class="hover:opacity-70 transition-opacity active:scale-95 duration-200 font-label-sm text-primary-container">
            保存
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-container-margin py-unit flex flex-col gap-6 relative z-10 max-w-2xl mx-auto w-full">
<!-- Large Input Card -->
<section class="bg-surface-container-lowest rounded-[32px] p-card-padding ambient-shadow flex flex-col gap-4">
<input class="w-full bg-transparent border-none text-headline-md text-on-surface placeholder:text-stone-400 placeholder:font-light focus:ring-0 px-0 pb-2 border-b border-surface-container-high focus:border-primary-container transition-colors" placeholder="请输入标题（可选）" type="text"/>
<textarea class="w-full bg-transparent border-none text-body-md text-on-surface placeholder:text-stone-400 placeholder:font-light focus:ring-0 px-0 resize-none min-h-[200px]" placeholder="此刻的想法、感受、灵感…" rows="8"></textarea>
<div class="flex justify-between items-center mt-2">
<!-- Toolbar -->
<div class="flex gap-4 text-stone-400">
<button class="hover:text-primary-container transition-colors flex flex-col items-center gap-1 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">image</span>
</button>
<button class="hover:text-primary-container transition-colors flex flex-col items-center gap-1 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">sell</span>
</button>
<button class="hover:text-primary-container transition-colors flex flex-col items-center gap-1 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">mood</span>
</button>
<button class="hover:text-primary-container transition-colors flex flex-col items-center gap-1 active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">mic</span>
</button>
</div>
<span class="font-label-sm text-stone-300 font-light">0/5000</span>
</div>
</section>
<!-- Mood & Tag Card -->
<section class="bg-[#F5EBE0]/30 rounded-[32px] p-card-padding ambient-shadow-light flex flex-col gap-6">
<!-- Mood Section -->
<div class="flex flex-col gap-3">
<h3 class="font-body-md text-on-surface-variant font-medium">心情（可选）</h3>
<div class="flex gap-4 overflow-x-auto pb-2 scrollbar-hide">
<button class="flex flex-col items-center gap-1 flex-shrink-0 group">
<div class="w-12 h-12 rounded-full bg-primary-container/20 flex items-center justify-center border border-primary-container/30 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">sentiment_calm</span>
</div>
<span class="font-label-sm text-primary-container">平静</span>
</button>
<button class="flex flex-col items-center gap-1 flex-shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center border border-transparent shadow-sm group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-stone-400">sentiment_satisfied</span>
</div>
<span class="font-label-sm text-stone-400">开心</span>
</button>
<button class="flex flex-col items-center gap-1 flex-shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center border border-transparent shadow-sm group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-stone-400">sentiment_worried</span>
</div>
<span class="font-label-sm text-stone-400">焦虑</span>
</button>
<button class="flex flex-col items-center gap-1 flex-shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center border border-transparent shadow-sm group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-stone-400">sentiment_dissatisfied</span>
</div>
<span class="font-label-sm text-stone-400">疲惫</span>
</button>
<button class="flex flex-col items-center gap-1 flex-shrink-0 group">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest flex items-center justify-center border border-transparent shadow-sm group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-stone-400">sentiment_sad</span>
</div>
<span class="font-label-sm text-stone-400">难过</span>
</button>
</div>
</div>
<!-- Tag Section -->
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<h3 class="font-body-md text-on-surface-variant font-medium">标签（可选）</h3>
<button class="font-label-sm text-primary-container hover:opacity-70 transition-opacity">+ 添加标签</button>
</div>
<div class="flex flex-wrap gap-2">
<span class="px-4 py-2 bg-surface-container-lowest rounded-full font-label-sm text-on-surface-variant shadow-sm border border-transparent hover:border-primary-container/30 cursor-pointer transition-colors">灵感</span>
<span class="px-4 py-2 bg-surface-container-lowest rounded-full font-label-sm text-on-surface-variant shadow-sm border border-transparent hover:border-primary-container/30 cursor-pointer transition-colors">成长</span>
<span class="px-4 py-2 bg-surface-container-lowest rounded-full font-label-sm text-on-surface-variant shadow-sm border border-transparent hover:border-primary-container/30 cursor-pointer transition-colors">反思</span>
<span class="px-4 py-2 bg-[#D6E2E9]/40 rounded-full font-label-sm text-on-surface-variant shadow-sm border border-transparent hover:border-primary-container/30 cursor-pointer transition-colors">情绪</span>
<span class="px-4 py-2 bg-surface-container-lowest rounded-full font-label-sm text-on-surface-variant shadow-sm border border-transparent hover:border-primary-container/30 cursor-pointer transition-colors">生活</span>
</div>
</div>
</section>
<!-- Spacer for footer -->
<div class="flex-1 min-h-[100px]"></div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-6 pb-8 pt-4 bg-white/95 backdrop-blur-lg rounded-t-[32px] shadow-[0_-8px_30px_rgb(0,0,0,0.04)]">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-stone-300 hover:text-[#A3B18A] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home_max">home_max</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest">Home</span>
</a>
<!-- Record (Active) -->
<a class="flex flex-col items-center justify-center text-[#A3B18A] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest">Record</span>
</a>
<!-- Chat -->
<a class="flex flex-col items-center justify-center text-stone-300 hover:text-[#A3B18A] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="bubble_chart">bubble_chart</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest">Chat</span>
</a>
<!-- Plan -->
<a class="flex flex-col items-center justify-center text-stone-300 hover:text-[#A3B18A] transition-all active:scale-90" href="#">
<span class="material-symbols-outlined mb-1" data-icon="auto_awesome_motion">auto_awesome_motion</span>
<span class="font-manrope text-[11px] font-semibold uppercase tracking-widest">Plan</span>
</a>
</nav>
</body></html>
